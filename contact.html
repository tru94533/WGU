<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact | Always Wonderful</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

    <nav>
        <div class="banner">
            <div class="intro_picture center-max-1200">
                <img src="images/banner.jpg" alt="Banner" title="Always Wonderful" />
            </div>
        </div>

        <div id="nav-bar">
            <a class="items" id="home-link" href="index.html">Home</a>
            <a class="items" id="how-link" href="how.html">How To Use</a>
            <a class="items" id="feature-link" href="feature.html">New Feature</a>
            <a class="items" id="download-link" href="download.html">Download</a>
            <a class="items" id="contact-link" href="contact.html">Contact Us</a>
        </div>
    </nav>

    <section id="main">
        <div class="intro_picture center-max-1200">
            <img src="images/meetings.jpg" alt="Always Wonderful meetings" title="Always Wonderful"/>
        </div>

        <div class="input-content center-max-1200">
            <b>User Information</b><br><br>
            <form id="submit_form">
                <label for="firstName">First Name:</label><br>
                <input type="text" id="firstName" name="firstName"><br><br>

                <label for="lastName">Last Name:</label><br>
                <input type="text" id="lastName" name="lastName"><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email"><br><br>

                <label for="confirmEmail">Confirm Email Address:</label><br>
                <input type="email" id="confirmEmail" name="confirmEmail"><br><br>

                <label for="question">Ask a Question:</label><br>
                <textarea id="question" name="question" rows="4" cols="50"></textarea><br><br>

                <input type="submit" value="Submit">
            </form>
        </div>
    </section>
    
    

    <script src="js/script.js"></script>
</body>

</html>
